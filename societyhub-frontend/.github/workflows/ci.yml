name: SocietyHub CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-build:
    name: Build Java Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: societyhub-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: societyhub-backend/pom.xml

      - name: Build backend
        run: mvn -B -DskipTests package

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: societyhub-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: societyhub-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
