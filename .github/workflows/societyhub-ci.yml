
name: SocietyHub CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-build:
    name: Build Java Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: societyhub-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: societyhub-backend/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build backend
        run: mvn -B -DskipTests package

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: societyhub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
