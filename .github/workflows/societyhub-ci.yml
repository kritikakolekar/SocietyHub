
name: SocietyHub CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: societyhub-backend/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build backend
        working-directory: societyhub-backend
        run: mvn -B -DskipTests package
